<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Diagrama 3 — Topología física simplificada, Puesto de Salud I-1 "Comunidad C" (unipersonal)</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#6b7280">Planta de referencia simplificada — red plana, sin segmentación VLAN 802.1Q (justificación en sección 2.5)</text>

  <!-- single room -->
  <rect x="60" y="80" width="620" height="260" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="370" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Ambiente único de atención (consultorio + botiquín de insumos)</text>

  <!-- person -->
  <g transform="translate(140,150)">
    <circle cx="0" cy="0" r="16" fill="#9ca3af"/>
    <rect x="-22" y="18" width="44" height="55" rx="10" fill="#9ca3af"/>
    <text x="0" y="95" text-anchor="middle" font-size="11" fill="#374151">Personal técnico</text>
    <text x="0" y="109" text-anchor="middle" font-size="11" fill="#374151">de enfermería (1)</text>
  </g>

  <!-- phone -->
  <g transform="translate(300,150)">
    <rect x="-24" y="-40" width="48" height="80" rx="8" fill="#1d4ed8"/>
    <circle cx="0" cy="30" r="4" fill="#ffffff"/>
    <text x="0" y="95" text-anchor="middle" font-size="11" fill="#374151">Smartphone con</text>
    <text x="0" y="109" text-anchor="middle" font-size="11" fill="#374151">app HemoScan Andino</text>
  </g>

  <!-- BLE link -->
  <line x1="180" y1="150" x2="256" y2="150" stroke="#111827" stroke-width="2" stroke-dasharray="2,4"/>
  <text x="218" y="138" text-anchor="middle" font-size="10" fill="#111827">BLE</text>

  <!-- node -->
  <g transform="translate(470,150)">
    <rect x="-30" y="-24" width="60" height="48" rx="6" fill="#0e7490" stroke="#083344" stroke-width="2"/>
    <circle cx="-12" cy="0" r="5" fill="#a5f3fc"/>
    <circle cx="12" cy="0" r="5" fill="#a5f3fc"/>
    <text x="0" y="70" text-anchor="middle" font-size="11" fill="#374151">Nodo HemoScan</text>
    <text x="0" y="84" text-anchor="middle" font-size="11" fill="#374151">Andino (rotativo)</text>
  </g>
  <line x1="324" y1="150" x2="440" y2="150" stroke="#111827" stroke-width="2" stroke-dasharray="2,4"/>
  <text x="382" y="138" text-anchor="middle" font-size="10" fill="#111827">BLE</text>

  <!-- CPE -->
  <g transform="translate(600,255)">
    <rect x="-45" y="-20" width="90" height="40" rx="6" fill="#374151" stroke="#111827" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="10" fill="#ffffff">Router 4G-LTE / CPE</text>
    <text x="0" y="45" text-anchor="middle" font-size="10" fill="#374151">SSID único — red plana</text>
    <text x="0" y="59" text-anchor="middle" font-size="10" fill="#374151">(SSID invitados opcional del propio CPE)</text>
  </g>
  <!-- wifi from phone to CPE -->
  <line x1="300" y1="190" x2="580" y2="250" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="440" y="230" text-anchor="middle" font-size="10" fill="#374151">WiFi doméstico / CPE simple</text>

  <!-- WAN arrow -->
  <line x1="600" y1="340" x2="600" y2="400" stroke="#111827" stroke-width="2"/>
  <polygon points="600,400 594,388 606,388" fill="#111827"/>
  <text x="700" y="395" text-anchor="middle" font-size="11" fill="#111827">WAN oportunista (2.6),</text>
  <text x="700" y="410" text-anchor="middle" font-size="10" fill="#6b7280">a menudo intermitente o ausente</text>

  <rect x="420" y="415" width="360" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="600" y="437" text-anchor="middle" font-size="11" fill="#374151">Internet público (cuando existe señal) ⇢ VPC HemoScan Andino (Diagrama 1)</text>
</svg>
