    <rect x="737" y="150" width="60" height="42" rx="4" fill="#fde68a" stroke="#92400e"/>
    <rect x="745" y="156" width="44" height="26" fill="#fff7ed"/>
    <rect x="759" y="192" width="16" height="8" fill="#92400e"/>
    <text x="767" y="212" text-anchor="middle" font-size="11" fill="#6b7280">1 PC</text>
