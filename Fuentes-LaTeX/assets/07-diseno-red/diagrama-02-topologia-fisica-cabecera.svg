    <rect x="335" y="112" width="270" height="105" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="470" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Estadística / Informática (HIS)</text>
    <rect x="440" y="150" width="60" height="42" rx="4" fill="#fde68a" stroke="#92400e"/>
    <rect x="448" y="156" width="44" height="26" fill="#fff7ed"/>
    <rect x="462" y="192" width="16" height="8" fill="#92400e"/>
    <text x="470" y="212" text-anchor="middle" font-size="11" fill="#6b7280">1 PC</text>

