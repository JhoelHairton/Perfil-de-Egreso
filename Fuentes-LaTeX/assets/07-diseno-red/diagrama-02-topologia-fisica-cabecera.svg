    <rect x="30" y="80" width="900" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="45" y="100" font-size="13" font-weight="700" fill="#9a3412">VLAN 20 — ADMINISTRATIVO (10.20.0.32/27)</text>

    <rect x="45" y="112" width="270" height="105" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="180" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Jefatura / Dirección</text>
    <rect x="150" y="150" width="60" height="42" rx="4" fill="#fde68a" stroke="#92400e"/>
    <rect x="158" y="156" width="44" height="26" fill="#fff7ed"/>
