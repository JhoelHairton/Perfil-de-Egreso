    <rect x="335" y="512" width="270" height="105" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="470" y="530" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Laboratorio clínico</text>
    <rect x="442" y="548" width="56" height="36" rx="6" fill="#1d4ed8"/>
    <circle cx="470" cy="576" r="3" fill="#ffffff"/>
    <text x="470" y="600" text-anchor="middle" font-size="10" fill="#6b7280">Tel. ⇢BLE⇢ Nodo/HemoCue</text>

    <rect x="625" y="512" width="285" height="105" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="767" y="530" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Obstetricia / Enfermería / Medicina</text>
    <rect x="739" y="548" width="56" height="36" rx="6" fill="#1d4ed8"/>
    <circle cx="767" cy="576" r="3" fill="#ffffff"/>
    <text x="767" y="600" text-anchor="middle" font-size="10" fill="#6b7280">Tel. ⇢BLE⇢ Nodo</text>
  </g>

  <!-- AP interno -->
  <g transform="translate(755,352)">
    <circle cx="0" cy="20" r="8" fill="#1f2937"/>
    <path d="M -14 6 A 20 20 0 0 1 14 6" fill="none" stroke="#1f2937" stroke-width="2"/>
    <path d="M -8 12 A 11 11 0 0 1 8 12" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="0" y="46" text-anchor="middle" font-size="9" fill="#374151">AP doble banda</text>
    <text x="0" y="58" text-anchor="middle" font-size="9" fill="#374151">5GHz→VLAN10 (2.7.1)</text>
  </g>

  <!-- Row D: Invitados VLAN 40 -->
