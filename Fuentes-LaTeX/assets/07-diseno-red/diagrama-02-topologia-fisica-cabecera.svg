<svg viewBox="0 0 1200 840" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="840" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Diagrama 2 — Topología física de referencia, Centro de Salud I-4 "Altiplano" (cabecera)</text>
  <text x="600" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Planta de referencia por analogía con el Entregable N.° 1 (sección 1.1.2) — no es un levantamiento arquitectónico real</text>

  <!-- Legend -->
  <g transform="translate(970,70)">
    <rect x="0" y="0" width="212" height="150" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="10" y="20" font-size="13" font-weight="700" fill="#111827">Leyenda VLAN</text>
    <rect x="10" y="30" width="16" height="16" fill="#dbeafe" stroke="#2563eb"/>
    <text x="32" y="43" font-size="12" fill="#1f2937">VLAN 10 · Clínico</text>
    <rect x="10" y="52" width="16" height="16" fill="#ffedd5" stroke="#ea580c"/>
    <text x="32" y="65" font-size="12" fill="#1f2937">VLAN 20 · Administrativo</text>
    <rect x="10" y="74" width="16" height="16" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="32" y="87" font-size="12" fill="#1f2937">VLAN 30 · Gestión de Red</text>
    <rect x="10" y="96" width="16" height="16" fill="#dcfce7" stroke="#16a34a"/>
    <text x="32" y="109" font-size="12" fill="#1f2937">VLAN 40 · Invitados</text>
