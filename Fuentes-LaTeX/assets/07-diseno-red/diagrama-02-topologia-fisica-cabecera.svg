    <rect x="30" y="660" width="900" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="480" y="695" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">VLAN 40 — INVITADOS (10.20.0.80/28)</text>
    <text x="480" y="715" text-anchor="middle" font-size="12" fill="#166534">Sala de espera / recepción — Punto de acceso, SSID "invitados"</text>
    <g transform="translate(870,690)">
      <circle cx="0" cy="10" r="7" fill="#166534"/>
      <path d="M -11 -2 A 16 16 0 0 1 11 -2" fill="none" stroke="#166534" stroke-width="2"/>
    </g>
  </g>

  <!-- Cabling lines (dashed) -->
  <line x1="180" y1="217" x2="520" y2="330" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="470" y1="217" x2="560" y2="315" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="767" y1="217" x2="660" y2="330" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="180" y1="480" x2="540" y2="430" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="470" y1="480" x2="580" y2="430" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="767" y1="480" x2="640" y2="430" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="660" x2="560" y2="427" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- WAN arrow -->
  <line x1="750" y1="360" x2="1000" y2="360" stroke="#111827" stroke-width="2"/>
  <polygon points="1000,360 990,354 990,366" fill="#111827"/>
  <text x="875" y="350" text-anchor="middle" font-size="11" fill="#111827">WAN oportunista (2.6)</text>
  <text x="875" y="378" text-anchor="middle" font-size="10" fill="#6b7280">→ Internet → VPC (Diagrama 1)</text>

  <text x="600" y="800" text-anchor="middle" font-size="11" fill="#6b7280">Referencia cruzada textual complementaria (versión ASCII) disponible en el Anexo D.</text>
</svg>
