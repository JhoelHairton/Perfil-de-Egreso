    <text x="600" y="304" text-anchor="middle" font-size="11" fill="#374151">Gabinete de telecomunicaciones (con llave)</text>

    <!-- rack icon -->
    <rect x="520" y="312" width="160" height="115" rx="4" fill="#374151" stroke="#111827" stroke-width="2"/>
    <rect x="530" y="320" width="140" height="18" rx="2" fill="#9ca3af"/>
    <circle cx="662" cy="329" r="3" fill="#22c55e"/>
    <text x="536" y="333" font-size="9" fill="#111827">Switch 802.1Q PoE 8-16p</text>
    <rect x="530" y="342" width="140" height="18" rx="2" fill="#9ca3af"/>
    <circle cx="662" cy="351" r="3" fill="#22c55e"/>
    <text x="536" y="355" font-size="9" fill="#111827">Router/CPE WAN (2.6)</text>
    <rect x="530" y="364" width="140" height="18" rx="2" fill="#9ca3af"/>
    <text x="536" y="377" font-size="9" fill="#111827">Patch panel Cat6/6A</text>
    <rect x="530" y="386" width="140" height="16" rx="2" fill="#d1d5db" stroke="#6b7280" stroke-dasharray="3,2"/>
    <text x="536" y="398" font-size="9" fill="#6b7280">UPS — objetivo Fase 1/2 (brecha 3.4)</text>

    <text x="600" y="440" text-anchor="middle" font-size="10" fill="#374151">Puesta a tierra y protección de sobretensión (TIA/EIA-607)</text>
  </g>

  <!-- Row C: Clinico VLAN 10 -->
  <g>
    <rect x="30" y="480" width="900" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
